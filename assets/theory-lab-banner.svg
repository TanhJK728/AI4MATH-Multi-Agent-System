    <text x="58" y="151" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-2">Theory Lab</text>
    <text x="62" y="202" fill="#d3dbed" font-size="23">Independent reasoning. Structured review. Measured costs.</text>
    <rect x="62" y="248" width="112" height="34" rx="17" fill="#1e3a61"/>
    <text x="118" y="270" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">FRAMEWORK</text>
    <rect x="186" y="248" width="124" height="34" rx="17" fill="#103e43"/>
    <text x="248" y="270" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">EXPERIMENTS</text>
