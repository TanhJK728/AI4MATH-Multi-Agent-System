<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Theory Lab</title>
  <desc id="desc">Independent reasoning. Structured review. Measured costs. A research program on multi-agent AI for mathematics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d3e"/><stop offset="1" stop-color="#211841"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8093bd" opacity=".15"/></pattern>
  </defs>
  <rect width="1280" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="330" rx="20" fill="url(#dots)"/>
  <path d="M870 12C940 128 1030 70 1160 174S1280 270 1300 296" fill="none" stroke="#7066b5" stroke-width="1" opacity=".32"/>
